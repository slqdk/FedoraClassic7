---
name: Debug ISO build
on:
  workflow_dispatch:

jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            userns: fix
          - os: ubuntu-24.04
            userns: keep
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run bootc-image-builder and report its output
        run: |
          if [ "${{ matrix.userns }}" = fix ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true; fi
          echo "::notice title=env ${{ matrix.os }}::userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>&1) $(podman --version)"
          podman --version
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fedoraclassic7:latest"
          sed -i "s|ghcr.io/[^ ]*:latest|${IMAGE}|" ./disk_config/iso.toml
          df -h / /mnt || true
          mkdir -p output
          set -o pipefail
          rc=0
          {
            sudo podman pull "$IMAGE" &&
            sudo podman image inspect "$IMAGE" --format 'size={{.Size}}' &&
            sudo podman run --rm --privileged --pull=newer \
              --security-opt label=type:unconfined_t \
              -v ./disk_config/iso.toml:/config.toml:ro \
              -v ./output:/output \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              quay.io/centos-bootc/bootc-image-builder:latest \
              --type anaconda-iso --use-librepo=True --rootfs btrfs "$IMAGE"
          } 2>&1 | tee bib.log || rc=$?
          clean() { grep -v -e 'Copying blob' -e 'Downloaded Packages' -e '^[A-Za-z0-9+/=]\{40,\}' bib.log | cut -c1-300; }
          msg="$(clean | tail -50 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          echo "::error title=bib ${{ matrix.os }} exit ${rc}::${msg}"
          hl="$(clean | grep -nE 'Error|error:|Traceback|[Ff]ailed|No space|exit status|returned non-zero' | tail -40 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          echo "::warning title=highlights ${{ matrix.os }}::${hl}"
          echo "::warning title=disk ${{ matrix.os }}::$(df -h / /mnt 2>&1 | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          exit $rc
