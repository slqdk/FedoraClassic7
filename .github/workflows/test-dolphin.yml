# Explorer (Dolphin) with this branch's Classic 7 layout, in the published image (Xvfb + KWin):
# a new account (from /etc/skel) and an existing one (Appearance > Explorer). Screenshots go
# to the ci-shots-dolphin branch.
name: Test Explorer layout

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dolphin:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Render
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fedoraclassic7:latest"
          mkdir -p shots && chmod 777 shots
          cat > shots/run.sh <<'EOS'
          set -x
          dnf5 -y -q install xorg-x11-server-Xvfb ImageMagick xdotool >/dev/null 2>&1 || true
          S=/src/system_files
          cp -a $S/usr/lib/classic7/. /usr/lib/classic7/
          cp -a $S/usr/share/classic7/. /usr/share/classic7/
          cp -a $S/etc/skel/. /etc/skel/
          # the image's merged /etc/xdg/dolphinrc gets this branch's defaults on top
          while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            if [[ "$line" =~ ^\[(.*)\]$ ]]; then g="${BASH_REMATCH[1]}"; continue; fi
            kwriteconfig6 --file /etc/xdg/dolphinrc --group "$g" --key "${line%%=*}" -- "${line#*=}"
          done < $S/usr/share/classic7/xdg-defaults/dolphinrc
          cat > /tmp/inner.sh <<'EOI'
          export XDG_RUNTIME_DIR=/tmp/xdg; mkdir -p $XDG_RUNTIME_DIR; chmod 700 $XDG_RUNTIME_DIR
          export DISPLAY=:99 QT_QPA_PLATFORM=xcb XDG_CURRENT_DESKTOP=KDE KDE_FULL_SESSION=true KDE_SESSION_VERSION=6
          Xvfb :99 -screen 0 1100x720x24 >/dev/null 2>&1 & sleep 2
          kwin_x11 --replace >/out/kwin.log 2>&1 & sleep 3
          shot() {   # name, url
            dolphin --new-window "$2" >>/out/dolphin.log 2>&1 & p=$!; sleep 8
            xdotool search --class dolphin windowsize %@ 1000 640 windowmove %@ 40 30 2>/dev/null; sleep 2
            import -window root /out/$1.png; kill $p; sleep 2
          }
          quitd() {   # quit like File > Quit, so Dolphin saves its layout
            pid=$(pgrep -x dolphin | head -1)
            dbus-send --session --type=method_call --dest=org.kde.dolphin-$pid /dolphin/Dolphin_1/actions/file_quit org.qtproject.Qt.QAction.trigger >>/out/dolphin.log 2>&1
            sleep 3; pkill -x dolphin; sleep 1
          }
          start() { dolphin --new-window "$1" >>/out/dolphin.log 2>&1 & sleep 8; }
          # A) image defaults, no account files: toggle panels off, quit, see what is saved where
          export HOME=/tmp/a; mkdir -p $HOME/Documents; touch /tmp/stamp
          start $HOME/Documents; import -window root /out/a1.png
          for k in F11 F4 F7; do xdotool search --class dolphin key --window %@ $k 2>/dev/null; sleep 1; done
          import -window root /out/a2.png; quitd
          (cd $HOME && find . -type f -newer /tmp/stamp | sort) > /out/a-files.txt
          for f in $(cd $HOME && find . -type f -newer /tmp/stamp); do echo "=== $f"; head -c 1500 "$HOME/$f"; echo; done > /out/a-contents.txt
          start $HOME/Documents; import -window root /out/a3.png; quitd
          # E) without Version in /etc/xdg/dolphinrc (first run), with our skel files
          kwriteconfig6 --file /etc/xdg/dolphinrc --group General --key Version --delete
          export HOME=/tmp/e; mkdir -p $HOME/Documents; cp -a /etc/skel/. $HOME/
          start $HOME/Documents; import -window root /out/e.png; quitd
          # F) without Version, no skel files at all
          export HOME=/tmp/f; mkdir -p $HOME/Documents
          start $HOME/Documents; import -window root /out/f.png; quitd
          EOI
          mkdir -p /out && chmod 777 /out
          dbus-run-session -- bash /tmp/inner.sh
          EOS
          timeout 900 sudo podman run --rm --privileged -v "$PWD:/src:ro" -v "$PWD/shots:/out" "$IMAGE" bash /out/run.sh > shots/container.log 2>&1 || true
          ls -la shots
          echo "::notice title=files::$(ls shots | tr '\n' ' ')"

      - name: Save to ci-shots-dolphin
        run: |
          mkdir -p /tmp/o && cp shots/*.png shots/*.log shots/*.xbel shots/*.txt /tmp/o/ 2>/dev/null || true
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan ci-shots-dolphin
          git rm -rfq --cached . >/dev/null 2>&1 || true
          git clean -fdxq
          cp /tmp/o/* . 2>/dev/null || true
          git add -A; git commit -qm "Explorer render" || exit 0
          git push -f origin ci-shots-dolphin
