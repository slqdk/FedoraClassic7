---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      release:
        description: "Publish the ISO as a GitHub Release (in parts under 2 GB, GitHub's limit per file)"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso.toml'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}  # bootc-image-builder can't mount on 26.04 runners
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["anaconda-iso"]
    permissions:
      contents: write     # the GitHub Release
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Point the installer at this repo's image
        run: |
          sed -i "s|ghcr.io/[^ ]*:latest|${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}|" ./disk_config/iso.toml
          grep -n "bootc switch" ./disk_config/iso.toml

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True --rootfs btrfs  # Bazzite sets no default root filesystem

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && inputs.release != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}

      - name: Publish as a GitHub Release
        if: inputs.release == true && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail
          iso="$(find "$OUT" -name '*.iso' | head -1)"
          test -n "$iso"
          day="$(date -u +%Y.%m.%d)"
          tag="v$day"; n=2
          while gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do tag="v$day-$n"; n=$((n + 1)); done
          name="Classic7-${tag#v}.iso"
          mkdir -p release
          mv "$iso" "release/$name"
          cd release
          sha256sum "$name" > SHA256SUMS
          split -b 1950M -d -a 2 "$name" "$name.part"
          rm "$name"
          sha256sum "$name".part* >> SHA256SUMS
          cat SHA256SUMS
          python3 - "$name" "$GITHUB_REPOSITORY" > notes.md <<'PY'
          import re, sys
          name, repo = sys.argv[1], sys.argv[2]
          text = open("../system_files/usr/share/classic7/changes.txt", encoding="utf-8").read()
          entries, cur = [], None
          for line in text.splitlines():
              m = re.match(r"##\s*(\d{4}-\d\d-\d\d)\s*(.*)", line)
              if m:
                  cur = [m.group(1), m.group(2).strip(), []]
                  entries.append(cur)
              elif cur and line.strip().startswith("-"):
                  cur[2].append(line.strip())
          newest = entries[0][0] if entries else ""
          print(f"""Classic 7 installer, for new installs (an installed Classic 7 updates itself).

          **Download** all the `{name}.partNN` files and `SHA256SUMS`, then join the parts into one ISO
          (GitHub allows at most 2 GB per file):

          - Windows, in a Command Prompt in the download folder: `copy /b {name}.part* {name}`
          - Linux or macOS: `cat {name}.part* > {name}`

          Check it: `sha256sum -c SHA256SUMS --ignore-missing` (Linux), or in PowerShell
          `(Get-FileHash {name}).Hash` and compare with the first line of `SHA256SUMS`.
          Then write it to a USB stick (Fedora Media Writer, Ventoy or `dd`), boot from it and install;
          see the [README](https://github.com/{repo}#install) (Secure Boot is described there too).

          The installer installs `ghcr.io/{repo.split('/')[0].lower()}/fedoraclassic7:latest`.
          """.replace("\n          ", "\n"))
          print(f"## What's new ({newest})\n")
          for date, title, items in entries:
              if date != newest:
                  break
              print(f"### {title}\n")
              print("\n".join(items) + "\n")
          PY
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Classic 7 ${tag#v}" --notes-file notes.md \
              "$name".part* SHA256SUMS
          echo "::notice title=release::https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
