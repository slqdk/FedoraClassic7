# Classic 7 login screen: the Windows 7 Welcome screen (classic7aero), as new accounts start in Aero.
# classic7.look.conf (written by /usr/libexec/classic7-login-screen) follows the theme chosen in
# Personalization: classic7 (the Log On dialog) for Classic. System Settings > Login Screen (SDDM)
# writes kde_settings.conf, which comes after both and so wins when you pick something else there.
[Theme]
Current=classic7aero
CursorTheme=Breeze_Light
